spring:
  datasource:
    url: jdbc:mysql://localhost:3306/gymdb?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true
server:
  port: 8080
logging:
  level:
    org.springframework.security: INFO
    org.springframework: DEBUG
    org.hibernate: DEBUG
    org.springframework.web: DEBUG
